plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    defaultConfig {
        applicationId "org.shandongtlb.hidkeyboard"
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName '1.6.0'
    }

    signingConfigs {
        if (System.getenv('HID_KEYSTORE')) {
            release {
                storeFile file(System.getenv('HID_KEYSTORE'))
                storePassword System.getenv('HID_STORE_PASSWORD')
                keyAlias System.getenv('HID_KEY_ALIAS') ?: 'hid-release'
                keyPassword System.getenv('HID_KEY_PASSWORD') ?: System.getenv('HID_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            if (System.getenv('HID_KEYSTORE')) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        aidl true
    }
    namespace 'org.sucareto.androidhidkeyboard'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}

dependencies {
    implementation 'com.github.topjohnwu.libsu:service:6.0.0'
    testImplementation 'junit:junit:4.13.2'
}
